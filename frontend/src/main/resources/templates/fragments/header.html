<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' — LabMineral Pro'">LabMineral Pro</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <style>
        .user-role-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            margin-left: 8px;
        }
        .user-role-badge.admin { background: #e74c3c; color: white; }
        .user-role-badge.analis { background: #2ecc71; color: white; }
        .user-role-badge.supervisor { background: #f39c12; color: white; }
        .user-role-badge.client, .user-role-badge.klien { background: #3498db; color: white; }
        .topbar-logout {
            display: inline-flex;
            align-items: center;
            padding: 5px 10px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--bg3);
            color: var(--red);
            text-decoration: none;
            font-size: .78rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div id="topbar" th:fragment="topbar(pageTitle, alertCount, userNama, userRole)">
    <h1 th:text="${pageTitle}">Judul Halaman</h1>
    <div class="topbar-right">
        <span th:if="${alertCount != null and alertCount > 0}" class="badge-alert"
              th:text="'&#9888; ' + ${alertCount} + ' Alert'">&#9888; 0 Alert</span>
        <span class="user-chip">
            <span th:text="'&#128100; ' + ${userNama != null ? userNama : 'Administrator Lab'}">&#128100; Admin</span>
            <span class="user-role-badge"
                  th:classappend="${userRole != null ? userRole : 'admin'}"
                  th:text="${#strings.toUpperCase(userRole != null ? userRole : 'admin')}">ADMIN</span>
        </span>
    </div>
</div>

</body>
</html>
