<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Pemberitahuan Sistem — LabMineral Pro</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); }
        .error-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 36px 32px; width: 440px; text-align: center; }
        .error-icon { font-size: 2.8rem; margin-bottom: 12px; }
        .error-title { color: var(--gold); font-size: 1.15rem; font-weight: 700; margin-bottom: 10px; }
        .error-desc { color: var(--text2); font-size: 0.85rem; line-height: 1.6; margin-bottom: 24px; }
        .error-code { font-family: monospace; font-size: 0.75rem; color: var(--text3); background: var(--bg3); padding: 4px 8px; border-radius: 4px; display: inline-block; margin-bottom: 20px; }
        .btn-back { display: inline-block; padding: 10px 20px; background: var(--gold2); color: #1a0f00; font-weight: 700; font-size: 0.85rem; text-decoration: none; border-radius: 7px; transition: 0.2s; }
        .btn-back:hover { background: var(--gold); }
    </style>
</head>
<body>

<div class="error-card">
    <div class="error-icon">&#9888;</div>
    <div class="error-title" th:text="${errorTitle}">Terjadi Kesalahan Sistem</div>
    <div class="error-code" th:if="${errorCode}" th:text="'KODE ERROR: ' + ${errorCode}">KODE ERROR: 500</div>
    <div class="error-desc" th:text="${errorMessage}">Silakan hubungi administrator laboratorium.</div>
    <div>
        <a th:href="@{/bahan}" class="btn-back">&#8592; Kembali ke Inventaris Bahan</a>
    </div>
</div>

</body>
</html>
